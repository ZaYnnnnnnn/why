name: Release extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter why-line-history package
      - name: Attach the extension to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '$0 ~ "^## " tag {found=1; next} /^## /{found=0} found' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md for what changed." > notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "why $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" apps/vscode/why-line-history.vsix --clobber
